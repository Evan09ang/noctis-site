</head>

    </nav>
  </header>
  <main class="sleep-main" id="main">
    <div class="wrap">
      <div class="sleep-intro">
        <h1>睡眠工具</h1>

      </div>
      <section class="sleep-card breathing" aria-labelledby="breathing-title">
        <div>
          <h2 id="breathing-title">一分钟呼吸</h2>
          <p>跟随光球，吸气 4 秒，呼气 6 秒。</p>
          <div class="tool-actions">
            <button class="tool-button tool-primary" id="breath-toggle" type="button">开始呼吸</button>
            <button class="tool-button" id="breath-reset" type="button" disabled>重置</button>
            <span class="breath-clock" id="breath-clock" role="timer" aria-label="呼吸练习剩余时间">1:00</span>
          </div>
        </div>
        <div class="breath-stage" id="breath-stage" data-state="idle">
          <div class="breath-orb" aria-hidden="true"></div>
          <span class="breath-phase" id="breath-phase" role="status">准备好后开始</span>
        </div>
      </section>
      <div class="sleep-grid">
        <section class="sleep-card" aria-labelledby="schedule-title" data-reveal>
          <h2 id="schedule-title">就寝时间倒推</h2>

          <form class="sleep-form" id="sleep-form">
            <label for="wake-time">起床时间<input id="wake-time" type="time" value="07:00" required></label>
            <label for="sleep-hours">目标睡眠（小时）<input id="sleep-hours" type="number" min="1" max="16" step="0.25" value="8" required></label>
            <label for="sleep-latency">入睡预留（分钟）<input id="sleep-latency" type="number" min="0" max="120" step="1" value="15" required></label>
            <button class="tool-button tool-primary" type="submit">计算上床时间</button>
          </form>
          <output class="sleep-result" id="sleep-result" for="wake-time sleep-hours sleep-latency" role="status"></output>
        </section>
        <section class="sleep-card" aria-labelledby="checklist-title" data-reveal>
          <h2 id="checklist-title">睡前清单</h2>
          <p>每天下午 12 点重置。</p>
          <div class="checklist" id="checklist">
            <label><input id="check-alarm" type="checkbox">设好明早的闹钟</label>
            <label><input id="check-light" type="checkbox">把灯光调暗</label>
            <label><input id="check-screen" type="checkbox">把手机放到一边</label>
            <label><input id="check-tomorrow" type="checkbox">记下明天的第一件事</label>
          </div>
          <div class="check-progress" id="check-progress" role="progressbar" aria-label="睡前清单完成进度" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span></span></div>
        </section>
      </div>
    </div>
<div class="wrap"><section class="app-bridge" aria-labelledby="continue-title"><h2 id="continue-title">床头钟与小睡</h2><p>浏览器里可以看时间、听雨。定时播放和小睡叫醒可在 Android 首页设置。</p><div class="bridge-actions"><a class="button" href="clock.html">打开网页床头钟 ↗</a><a class="text-link" href="support.html#android">获取 Android App</a></div></section></div>
  </main>

</body>
</html>
