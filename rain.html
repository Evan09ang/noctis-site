<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1a15">
  <meta name="description" content="拖动光点调节雨声的远近与轻重。把你调好的雨做成链接，或者带到 NOCTIS 网页床头钟。">
  <title>雨声实验室 · NOCTIS</title>
  <link rel="icon" href="assets/mark.svg">
  <link rel="stylesheet" href="assets/site.css?v=7">
  <link rel="stylesheet" href="assets/tools.css?v=7">
  <script type="module" src="assets/rain-room.js?v=1"></script>
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <header class="top">
    <nav class="nav wrap" aria-label="主导航">
      <a class="brand" href="index.html" aria-label="NOCTIS 首页"><img src="assets/mark.svg" alt="" width="30" height="30"><span>NOCTIS</span></a>
      <div class="nav-links"><a href="rain.html" aria-current="page">雨声实验室</a><a href="clock.html">床头钟</a><a href="sleep.html">睡眠工具</a><a href="about.html">关于</a></div>
      <a class="nav-cta" href="support.html#android">Android 下载 <svg class="glyph" aria-hidden="true"><use href="assets/icons.svg#download"/></svg></a>
      <details class="nav-menu"><summary aria-label="导航菜单"><svg class="glyph" aria-hidden="true"><use href="assets/icons.svg#menu"/></svg></summary><div><a href="rain.html" aria-current="page">雨声实验室</a><a href="clock.html">床头钟</a><a href="sleep.html">睡眠工具</a><a href="about.html">关于</a><a href="support.html">用户支持</a></div></details>
    </nav>
  </header>
  <main class="wrap tool-main" id="main">
    <div class="tool-title">
      <h1>雨声实验室</h1>
      <p>拖动光点，向右加重雨势，向上拉远距离。</p>
    </div>
    <div class="rain-console">
      <div class="rain-visual">
        <div class="rain-pad" id="rain-pad" aria-hidden="true">
          <canvas id="rain-canvas"></canvas>
          <div class="rain-cross"></div>
          <span class="rain-axis axis-top">远</span><span class="rain-axis axis-bottom">近</span>
          <span class="rain-axis axis-left">轻</span><span class="rain-axis axis-right">重</span>
          <span class="rain-point"></span>
        </div>
      </div>
      <div class="rain-controls">
        <div>
          <h2 id="rain-title">远处轻雨</h2>
        </div>
        <div class="tool-pills" role="group" aria-label="雨声预设">
          <button type="button" data-preset="26,72">远处轻雨</button>
          <button type="button" data-preset="41,20">窗边雨滴</button>
          <button type="button" data-preset="88,39">连绵大雨</button>
        </div>
        <div class="tool-ranges">
          <label for="rain-strength"><span>雨势 <output id="strength-value">26%</output></span><input type="range" id="rain-strength" min="0" max="100" value="26"></label>
          <label for="rain-distance"><span>距离 <output id="distance-value">72%</output></span><input type="range" id="rain-distance" min="0" max="100" value="72"></label>
          <label for="rain-volume"><span>音量</span><input type="range" id="rain-volume" min="0" max="100" value="42"></label>
        </div>
        <div class="tool-actions">
          <button class="button" id="rain-play" type="button">播放雨声</button>
          <button class="tool-secondary" id="rain-share" type="button">分享这场雨</button>
        </div>
        <label class="share-link" id="rain-share-box" hidden>复制链接<input id="rain-share-url" type="url" readonly></label>
        <p class="tool-status" id="rain-status" role="status"></p>
        <a class="text-link rain-to-clock" id="rain-to-clock" href="clock.html">带着这场雨去床头钟 <svg class="glyph" aria-hidden="true"><use href="assets/icons.svg#external"/></svg></a>
      </div>
    </div>
    <noscript><p>雨声实验室需要启用 JavaScript。</p></noscript>
  </main>
  <footer class="footer"><div class="wrap"><a class="brand" href="index.html" aria-label="NOCTIS 首页"><img src="assets/mark.svg" alt="" width="30" height="30"><span>NOCTIS</span></a><nav aria-label="页脚导航"><a href="about.html">关于 NOCTIS</a><a href="support.html">用户支持</a><a href="privacy.html">隐私政策</a><a href="terms.html">免费与 Plus</a><a href="credits.html">素材许可</a><a id="survey-footer" href="https://v.wjx.cn/vm/Q10hQEz.aspx" target="_blank" rel="noopener noreferrer">体验问卷 <svg class="glyph" aria-hidden="true"><use href="assets/icons.svg#external"/></svg></a></nav></div></footer>
</body>
</html>
