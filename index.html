<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="NOCTIS 是一款离线自然声音应用。体验沉浸声境、自由混音与小睡叫醒。">
  <meta name="theme-color" content="#101714"><title>NOCTIS · 给自己一点安静</title>
  <link rel="icon" href="assets/mark.svg"><link rel="stylesheet" href="assets/site.css"><script src="assets/site.js" defer></script>
</head>
<body>
<header class="top"><nav class="nav" aria-label="主导航"><a class="brand" href="index.html"><img src="assets/mark.svg" alt="">NOCTIS</a><div><a href="#scenes">声境</a><a href="#nap">小睡</a><a href="support.html">支持</a></div></nav></header>
<main>
  <section class="hero">
    <img class="hero-poster" src="assets/forest.jpg" alt="">
    <video class="hero-video" src="assets/forest.mp4" poster="assets/forest.jpg" muted playsinline loop preload="none" aria-hidden="true"></video>
    <div class="hero-inner"><span class="wordmark">N O C T I S</span><h1>给自己一点安静。</h1><p>让风、雨和水声，陪你度过想慢下来的一刻。</p><a class="button" href="#scenes">试听声境 <span aria-hidden="true">↓</span></a></div>
    <button class="motion" type="button" hidden>暂停背景</button>
  </section>
  <section class="wrap section" id="scenes">
    <div class="intro"><h2>从一段自然声开始。</h2><p>选一处风景，听一听它的声音。</p></div>
    <div class="scene">
      <img id="scene-photo" src="assets/forest.jpg" alt="薄雾中的河岸">
      <div class="scene-caption"><span id="scene-name">林风</span><button class="play" id="preview" type="button" aria-pressed="false">▷ 试听</button></div>
    </div>
    <div class="scene-tabs" aria-label="试听场景">
      <button type="button" data-scene="forest" aria-pressed="true">林风</button>
      <button type="button" data-scene="stream" aria-pressed="false">溪流</button>
      <button type="button" data-scene="ocean" aria-pressed="false">海浪</button>
    </div>
    <audio id="sample" preload="none" loop></audio><p id="audio-status" role="status"></p>
  </section>
  <section class="nap section" id="nap">
    <div class="wrap nap-grid"><div><h2>小睡一会儿。<br>让鸟鸣叫醒你。</h2><p>在首页点右上角的闹钟，选择时长和叫醒声。到点时，环境声慢慢退下，鸟鸣或溪流逐渐响起。</p><a class="text-link" href="support.html#nap-help">查看小睡使用方法 →</a></div>
      <div class="nap-preview" aria-label="应用界面示意"><span class="moon" aria-hidden="true">☾</span><strong>20<span> 分钟</span></strong><p>晨间鸟鸣 · 到点叫醒</p></div></div>
  </section>
  <section class="wrap section bottom"><h2>安静，也可以很简单。</h2><p>全屏风景、离线播放和属于自己的混音。</p><a class="button" href="support.html#android">获取 Android 试用版</a></section>
</main>
<footer class="footer"><div class="wrap"><a class="brand" href="index.html">NOCTIS</a><nav aria-label="页脚导航"><a href="privacy.html">隐私政策</a><a href="support.html">用户支持</a><a href="terms.html">订阅服务条款</a><a href="credits.html">素材许可</a></nav></div></footer>
</body></html>
